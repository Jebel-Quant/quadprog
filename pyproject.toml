[project]
license = "MIT"
license-files = ["LICENSE"]
name = "cvx-quadprog"
version = "0.1.0"
description = "Goldfarb/Idnani dual quadratic programming solver in NumPy and SciPy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.11.0",
]
authors = [{name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvx"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # The reference C implementation, used only by tests/test_against_c.py to
    # check this port against it. Not needed to use the package.
    "pytest-timeout>=2.0",
    "quadprog>=0.1.13",
]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.interrogate]
fail-under = 100
ignore-init-method = false
ignore-module = false

[project.urls]
Homepage = "https://github.com/Jebel-Quant/quadprog"
Repository = "https://github.com/Jebel-Quant/quadprog"

[tool.bumpversion]
current_version = "0.1.0"
tag = false
commit = false
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(?ms)^\[project\]((?:(?!^\[)[\s\S])*?)^version = "{current_version}"'
replace = '[project]\1version = "{new_version}"'
