repository: "jebel-quant/rhiza"
ref: "v1.4.2"

profiles:
  - github-project

templates:
  # Ships .github/workflows/rhiza_paper.yml, which compiles docs/paper/*.tex and
  # publishes the PDF both as a workflow artifact and on the `paper` branch.
  - github-paper

# Destination paths the sync must not deliver. A directory entry covers everything under it.
# These are *destination* paths -- where the file lands in this repo -- not paths inside the
# template clone: `normalise_excludes` takes each entry as written and only tidies separators,
# so a clone-relative spelling like `bundles/github/.github/...` would match nothing, silently.
exclude:
  # The fuzzing workflow, which needs FUZZING_ENABLED plus a `.clusterfuzzlite/` config this repo
  # does not have. Its gate sits *inside* the reusable workflow rather than in the caller, so it
  # starts on every pull request and every push to main in order to skip -- a green check whose
  # only content is that it had nothing to do.
  - .github/workflows/rhiza_fuzzing.yml

  # The mutation stub, for the same reason plus a worse one. This entry previously carried a note
  # saying the caller was deliberately kept, because a MUTATION_ENABLED variable set to 'false'
  # meant someone had configured the gate on purpose and flipping it to 'true' should be all it
  # took. That premise was wrong: `gh api repos/Jebel-Quant/quadprog/actions/variables` returns
  # `total_count: 0`, so the variable does not exist and never did. `.github/workflows/mutation.yml`
  # and docs/development/MUTATION.md both say "left unset", which is what agrees with the API.
  #
  # With nothing to flip, the stub's `if: vars.MUTATION_ENABLED == 'true'` can only skip -- and it
  # triggers on `pull_request:`, so every PR starts a run in order to do so. Unlike the fuzzing
  # caller the gate is at least in this file rather than inside the reusable workflow, but the
  # visible result is identical: a green check whose only content is that it had nothing to do.
  #
  # It could not be turned on as it stands either. The reusable workflow fails the job if *any*
  # mutant survives, and fourteen of this package's are provably equivalent (MUTATION.md), so a
  # 100% gate can never go green here. `.github/workflows/mutation.yml` is the repo-owned answer:
  # weekly rather than per-PR, and gated on a baseline rather than on zero. The decision stays
  # visible there and in MUTATION.md, which is where it was already recorded.
  - .github/workflows/rhiza_mutation.yml

  # The template's PAT_TOKEN and release-secret walkthrough. It documents secrets a consumer
  # configures once in the platform UI, addressed to whoever set the repo up rather than to anyone
  # reading the tree. Upstream is where it belongs, and where it stays.
  - .github/CONFIG.md

  # The discussion and issue forms. Multi-field forms with required textareas, arriving at a
  # template tag, for a repository whose issues and discussions are opened by the person who wrote
  # the code: the friction lands entirely on the one contributor a form's structure was never meant
  # to discipline. Both stay enabled and free-form.
  #
  # v1.4.2 no longer ships these three paths at all, so the orphan sweep would remove them either
  # way; the entries are what makes the decision explicit and survive a future upstream revival.
  - .github/DISCUSSION_TEMPLATE
  - .github/ISSUE_TEMPLATE
