repository: "jebel-quant/rhiza"
ref: "v1.7.2"

profiles:
  - github-project

templates:
  # Ships .github/workflows/rhiza_paper.yml, which compiles docs/paper/*.tex and
  # publishes the PDF both as a workflow artifact and on the `paper` branch.
  - github-paper
  # SECURITY.md and the community docs. LICENSE is excluded below.
  - legal

exclude:
  # The template's LICENSE. `legal` is synced for SECURITY.md and the community docs,
  # but the licence text is this repository's own: the bundle ships MIT under
  # "Copyright (c) 2025 Jebel Quant Research", which is not this repo's holder.
  - LICENSE

  # The template's PAT_TOKEN and release-secret walkthrough. It documents secrets a consumer
  # configures once in the platform UI, addressed to whoever set the repo up rather than to anyone
  # reading the tree. Upstream is where it belongs, and where it stays.
  - .github/CONFIG.md

