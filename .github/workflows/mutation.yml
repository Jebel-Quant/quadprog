# Weekly mutation testing (repo-owned, deliberately not a rhiza stub).
#
# Two reasons this is not the template's `rhiza_mutation.yml`:
#
#   1. That stub triggers on `pull_request:` as well as the weekly schedule, and
#      mutation testing is far too slow to sit on every PR. The stub is
#      template-owned, so dropping the trigger there would be reverted by the
#      next `/rhiza:update`.
#   2. Its reusable workflow fails the job if *any* mutant survives -- a 100%
#      threshold. Twelve of this package's mutants are provably equivalent (see
#      docs/development/MUTATION.md), so that gate can never go green here, and
#      a permanently red check teaches people to ignore red checks.
#
# `vars.MUTATION_ENABLED` -- the variable the stub's gate reads -- has never been
# set on this repository, so the stub could only ever skip while still starting a
# run on every PR to do it. It is now excluded from the sync altogether; see
# `.rhiza/template.yml`. This workflow owns the schedule instead, and gates on a
# *baseline* rather than on zero: a new survivor is a regression and fails; the
# known equivalents do not.
#
# The template's `make mutation` is also overridden in the repo Makefile,
# because its recipe uses the mutmut 2.x CLI -- see jebel-quant/rhiza#1492.

name: Mutation

permissions:
  contents: read

on:
  schedule:
    - cron: "0 10 * * 1" # Monday 10:00 UTC, after the rhiza weekly jobs
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Equivalent mutants that cannot be killed. Raising this number is a
      # decision, not a fix: check the survivor against
      # docs/development/MUTATION.md first.
      MUTATION_BASELINE: 14
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Run mutation tests
        id: run
        run: make mutation
        continue-on-error: true

      - name: Compare survivors against the baseline
        run: |
          survived=$(grep -c ': survived' _tests/mutation/results.txt || true)
          echo "survivors: ${survived} (baseline ${MUTATION_BASELINE})"
          {
            echo "### Mutation testing"
            echo ""
            echo "Survivors: **${survived}** (baseline ${MUTATION_BASELINE})"
            echo ""
            grep ': survived' _tests/mutation/results.txt || echo "None."
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${survived}" -gt "${MUTATION_BASELINE}" ]; then
            echo "::error::${survived} mutants survived, above the baseline of ${MUTATION_BASELINE}."
            exit 1
          fi
          if [ "${survived}" -lt "${MUTATION_BASELINE}" ]; then
            echo "::notice::${survived} survivors, below the baseline of ${MUTATION_BASELINE} -- lower MUTATION_BASELINE."
          fi

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: _tests/mutation/
          if-no-files-found: warn
